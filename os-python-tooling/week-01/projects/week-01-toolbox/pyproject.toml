[project]
name = "week1-toolbox"
version = "0.1.0"
description = "Three small tools for learning Python ownership"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
file-counter = "week1_toolbox.file_counter:main"
json-pretty = "week1_toolbox.json_pretty:main"
log-filter = "week1_toolbox.log_filter:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
