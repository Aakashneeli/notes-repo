[project]
name = "week6-ingestion-study"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "pytest>=8,<10"]
